settings:
  hide: true
  content:
    merge: true

media:
  input: src/images
  output: /images

content:
  - name: site_de
    label: Site Content (DE)
    type: file
    path: src/index.11tydata.json
    format: json
    fields: &site_fields
      - name: title
        label: Browser Title
        type: string
      - name: displayTitle
        label: Hero Title
        type: string
        description: Use &shy; to add optional soft hyphenation for long words.
      - name: siteName
        label: Site Name
        type: string
      - name: hero
        label: Hero Settings
        type: object
        fields:
          - name: imageAltSuffix
            label: Hero Image Alt Suffix
            type: string
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: ariaLabel
            label: Navigation Aria Label
            type: string
          - name: items
            label: Navigation Items
            type: object
            list: true
            fields:
              - name: href
                label: Link Target
                type: string
              - name: ariaLabel
                label: Aria Label
                type: string
              - name: icon
                label: Icon
                type: string
              - name: label
                label: Label
                type: string
              - name: shortLabel
                label: Short Label
                type: string
      - name: ui
        label: Shared UI Labels
        type: object
        fields:
          - name: fallbackImageAlt
            label: Fallback Image Alt
            type: string
          - name: speakerTopicLabel
            label: Speaker Topic Label
            type: string
          - name: emailLabel
            label: Email Label
            type: string
          - name: emailAriaLabel
            label: Email Aria Label
            type: string
          - name: emailHint
            label: Email Hint
            type: string
      - name: congress
        label: Page Sections
        type: object
        fields:
          - name: donate
            label: Donation Section
            type: object
            fields:
              - name: title
                label: Title
                type: string
              - name: text
                label: Body Text
                type: text
              - name: ctaLabel
                label: Button Label
                type: string
              - name: href
                label: Donation URL
                type: string
          - name: quickFacts
            label: Hero Quick Facts
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: value
                label: Value
                type: string
          - name: intro
            label: Intro Section
            type: object
            fields:
              - name: paragraphs
                label: Paragraphs
                type: text
                list: true
          - name: overview
            label: Program Overview
            type: object
            fields:
              - name: title
                label: Section Title
                type: string
              - name: days
                label: Day Tabs
                type: object
                list: true
                fields:
                  - name: key
                    label: Day Key
                    type: string
                  - name: label
                    label: Day Label
                    type: string
          - name: speakers
            label: Talks
            type: object
            list: true
            fields:
              - name: day
                label: Day Key
                type: string
              - name: badge
                label: Badge
                type: string
              - name: image
                label: Card Image
                type: image
                required: false
              - name: imageAlt
                label: Image Alt
                type: string
              - name: name
                label: Speaker Name
                type: string
                description: Use &shy; to add optional soft hyphenation for long words.
              - name: org
                label: Organization
                type: string
              - name: session
                label: Time
                type: string
              - name: topic
                label: Topic
                type: string
          - name: framework
            label: Supporting Program
            type: object
            fields:
              - name: title
                label: Section Title
                type: string
                description: Use &shy; to add optional soft hyphenation for long words.
              - name: items
                label: Entries
                type: object
                list: true
                fields:
                  - name: image
                    label: Image
                    type: image
                    required: false
                  - name: imageAlt
                    label: Image Alt
                    type: string
                  - name: title
                    label: Title
                    type: string
                  - name: eyebrow
                    label: Eyebrow
                    type: string
                  - name: paragraphs
                    label: Paragraphs
                    type: text
                    list: true
          - name: faq
            label: FAQ Section
            type: object
            fields:
              - name: title
                label: Section Title
                type: string
              - name: heading
                label: Legacy Heading
                type: string
              - name: items
                label: FAQ Items
                type: object
                list: true
                fields:
                  - name: question
                    label: Question
                    type: string
                    description: Use &shy; to add optional soft hyphenation for long words.
                  - name: answer
                    label: Answer
                    type: text
              - name: team
                label: Contact Cards
                type: object
                list: true
                fields:
                  - name: name
                    label: Name
                    type: string
                  - name: org
                    label: Description
                    type: string
                  - name: emailUser
                    label: Email User Part
                    type: string
                  - name: emailDomain
                    label: Email Domain Part
                    type: string
                  - name: emailTld
                    label: Email TLD
                    type: string
          - name: exclusion
            label: Exclusion Clause
            type: object
            fields:
              - name: title
                label: Title
                type: string
              - name: labelLines
                label: Label Lines
                type: string
                list: true
              - name: paragraphs
                label: Paragraphs
                type: text
                list: true
          - name: imprint
            label: Imprint
            type: object
            fields:
              - name: heading
                label: Section Title
                type: string
              - name: paragraphs
                label: Paragraphs
                type: text
                list: true
  - name: site_en
    label: Site Content (EN)
    type: file
    path: src/en/index.11tydata.json
    format: json
    fields: *site_fields
